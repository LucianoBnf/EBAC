<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
            <h1>Formulário de cadastro</h1>
    <form>
            <label for="name">Nome:</label>
            <input id="name" type="text" placeholder="Escreva seu nome completo"><br />           
            <label for="mail">E-mail:</label>   
            <input id="mail" type="email" placeholder="Digite seu e-mail"> <br />     
            <label for="pass">Senha:</label> 
            <input id="pass" type="password" placeholder="Digite sua senha"> <br />                    
            <button type="submit">
            Cadastrar
            </button>     
   </form>
   <!--Segundo commit-->           
</body>
</html>
